{
    "Dhcp4": {
        "interfaces-config": {
            "interfaces": ["enp0s3"]
        },

        "lease-database": {
            "type": "memfile",
            "lfc-interval": 3600
        },

        "valid-lifetime": 21600,
        "max-valid-lifetime": 43200,

        "next-server": "192.168.0.1",

        "option-data": [
            {
                "name": "tftp-server-name",
                "data": "192.168.0.1"
            }
        ],

        "subnet4": [
            {
                "id": 1,
                "subnet": "192.168.0.0/24",

                "pools": [
                    {
                        "pool": "192.168.0.100 - 192.168.0.200"
                    }
                ],

                "option-data": [
                    {
                        "name": "subnet-mask",
                        "data": "255.255.255.0"
                    },
                    {
                        "name": "routers",
                        "data": "192.168.0.1"
                    }
                ]
            }
        ],

        "client-classes": [
            {
                "name": "FOG-Legacy-BIOS",
                "test": "option[93].hex == 0x0000",
                "boot-file-name": "undionly.kpxe"
            },

            {
                "name": "FOG-UEFI-32",
                "test": "option[93].hex == 0x0006",
                "boot-file-name": "i386-efi/snponly.efi"
            },

            {
                "name": "FOG-UEFI-64",
                "test": "option[93].hex == 0x0007",
                "boot-file-name": "snponly.efi"
            },

            {
                "name": "FOG-UEFI-64-2",
                "test": "option[93].hex == 0x0008",
                "boot-file-name": "snponly.efi"
            },

            {
                "name": "FOG-UEFI-64-3",
                "test": "option[93].hex == 0x0009",
                "boot-file-name": "snponly.efi"
            },

            {
                "name": "FOG-UEFI-ARM64",
                "test": "option[93].hex == 0x000b",
                "boot-file-name": "arm64-efi/snponly.efi"
            }
        ]
    }
}
